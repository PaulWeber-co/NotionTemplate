<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>Anti Procrastinator</title>
  <meta name="description" content="Notentracker, Prüfungstermine, Aufgaben und Fokuszeit für Studium und Schule — offline nutzbar, ohne Konto.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7">

  <!-- Als App auf dem Home-Bildschirm -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anti Procrastinator">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon-192.png" sizes="192x192">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="shell">
    <main id="app" aria-live="polite"></main>
  </div>

  <!-- Einrichtungsassistent -->
  <div id="onboard" hidden></div>

  <noscript>
    <div style="padding:40px 24px;text-align:center;font-family:system-ui">
      <h1 style="font-size:22px">JavaScript wird benötigt</h1>
      <p style="color:#666">Anti Procrastinator rechnet alles direkt im Browser — ohne JavaScript geht das nicht.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
